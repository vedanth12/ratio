<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ratio</title>
<meta name="description" content="Case study app for Indian law students: landmark cases, new Supreme Court and High Court judgments, flashcards and quizzes.">
<meta name="theme-color" content="#162026" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ratio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css?v=2">
<script>try{var t=localStorage.getItem("ratio2.theme");if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-new" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></symbol>
  <symbol id="i-lib" viewBox="0 0 24 24"><path d="M4 5h4v15H4zM10 5h4v15h-4zM15.6 5.4l3.7-1 3.9 14.5-3.7 1z"/></symbol>
  <symbol id="i-rev" viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></symbol>
  <symbol id="i-me" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-5.5 8-5.5s6.5 1.5 8 5.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 21c4 0 7-2.7 7-6.5 0-3.4-2.3-5.6-4-7.5-.3 2-1.3 3.2-2.5 3.5.3-3-1-6-3.5-7.5.2 3-1.7 5.2-3.2 7C4.6 11.4 5 13 5 14.5 5 18.3 8 21 12 21z"/></symbol>
</svg>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#home" aria-label="Ratio home"><span class="mark">R</span><b>Ratio</b></a>
    <nav class="tabs desk" aria-label="Sections">
      <a href="#home" data-tab="home">Home</a>
      <a href="#new" data-tab="new">New</a>
      <a href="#library" data-tab="library">Library</a>
      <a href="#revise" data-tab="revise">Revise</a>
      <a href="#me" data-tab="me">Me</a>
    </nav>
    <button class="iconbtn" id="opensearch" aria-label="Search all cases"><svg class="ico"><use href="#i-search"/></svg></button>
  </div>
</header>

<main class="wrap" id="main">
  <section id="v-home" class="view"></section>
  <section id="v-list" class="view" hidden>
    <div class="listlayout" id="listlayout">
      <div class="pane" id="pane"></div>
      <article class="sheet card" id="detail" aria-live="polite"></article>
    </div>
  </section>
  <section id="v-revise" class="view" hidden></section>
  <section id="v-me" class="view" hidden></section>
</main>

<nav class="tabs mob" aria-label="Sections">
  <a href="#home" data-tab="home"><svg class="ico"><use href="#i-home"/></svg>Home</a>
  <a href="#new" data-tab="new"><svg class="ico"><use href="#i-new"/></svg>New<i id="badge" hidden></i></a>
  <a href="#library" data-tab="library"><svg class="ico"><use href="#i-lib"/></svg>Library</a>
  <a href="#revise" data-tab="revise"><svg class="ico"><use href="#i-rev"/></svg>Revise<i id="duebadge" hidden></i></a>
  <a href="#me" data-tab="me"><svg class="ico"><use href="#i-me"/></svg>Me</a>
</nav>

<div class="overlay" id="search" hidden role="dialog" aria-label="Search all cases">
  <div class="bar-top">
    <div class="searchwrap"><svg class="ico"><use href="#i-search"/></svg><input class="search" id="gq" type="search" placeholder="Search every case, citation, principle…" autocomplete="off"></div>
    <button class="iconbtn" id="closesearch" aria-label="Close search"><svg class="ico"><use href="#i-x"/></svg></button>
  </div>
  <div class="results" id="gresults"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js?v=2"></script>
</body>
</html>
