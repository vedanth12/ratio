<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ratio</title>
<meta name="description" content="Case study app for Indian law students: landmark cases, new Supreme Court and High Court judgments, briefs and quizzes.">
<meta name="theme-color" content="#14202A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ratio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand"><b>Ratio</b><span id="updated">Loading cases…</span></div>
    <nav class="tabs desk" aria-label="Sections">
      <a href="#new" data-tab="new">New</a>
      <a href="#library" data-tab="library">Library</a>
      <a href="#quiz" data-tab="quiz">Quiz</a>
      <a href="#me" data-tab="me">Me</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main">
  <section id="v-list" class="view">
    <div class="pane">
      <div class="controls" id="controls"></div>
      <ul class="list" id="list"></ul>
    </div>
    <article class="sheet" id="detail" aria-live="polite"></article>
  </section>
  <section id="v-quiz" class="view" hidden></section>
  <section id="v-me" class="view" hidden></section>
</main>

<nav class="tabs mob" aria-label="Sections">
  <a href="#new" data-tab="new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>New<i id="badge" hidden></i></a>
  <a href="#library" data-tab="library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 4.5l3.8 1 -4 15.4-3.8-1z"/></svg>Library</a>
  <a href="#quiz" data-tab="quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/></svg>Quiz</a>
  <a href="#me" data-tab="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-5 8-5s6.5 1 8 5"/></svg>Me</a>
</nav>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
